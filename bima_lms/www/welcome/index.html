{% extends "templates/web.html" %}

{% block page_content %}
<div class="container my-5 text-center">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h2 class="card-title text-primary mb-3">Selamat Datang!</h2>
            <hr>
            <h4 class="fw-bold">{{ full_name }}</h4>
            <p class="text-muted mb-2">{{ email }}</p>
            
            <div class="mt-3">
                <span class="badge bg-info text-dark px-3 py-2" style="font-size: 1rem;">
                    Role: {{ user_roles }}
                </span>
            </div>

            <div class="mt-4">
                <a href="/me" class="btn btn-outline-secondary btn-sm">Profil Saya</a>
                <a href="/?cmd=web_logout" class="btn btn-danger btn-sm">Logout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
